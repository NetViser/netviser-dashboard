name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'dev'

env:
  GC_PROJECT_ID: 'netviser-454113'
  REGION: 'asia-southeast1'
  GAR_NAME: 'netviser-dashboard-gar'
  GAR_LOCATION: 'asia-southeast1'
  SERVICE: 'netviser-dashboard'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: GAR Auth
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Build and Push Container
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GC_PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -f Dockerfile.production --tag "${DOCKER_TAG}" --build-arg NEXT_PUBLIC_ENV=production .
          docker push "${DOCKER_TAG}"

      # Deploy to Cloud Run with custom CPU and memory settings using gcloud
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GC_PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.GC_PROJECT_ID }} \
            --cpu 8 \
            --max-instances 2 \
            --memory 16Gi \
            --platform managed

      - name: Allow Unauthenticated Access
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.GC_PROJECT_ID }} \
            --member="allUsers" \
            --role="roles/run.invoker"
