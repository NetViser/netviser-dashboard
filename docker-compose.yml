version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:${PORT:-3000}"  # Map host port 3000 to container's PORT (default 3000)
    environment:
      - NODE_ENV=production  # Set runtime env var
      - PORT=${PORT:-3000}   # Allow PORT to be overridden, default to 3000
    env_file:
      - .env  # Load additional env vars from .env file if needed
    restart: unless-stopped